# greetd for Jarvis OS: boot straight into the Jarvis session as user
# "jarvis" (design §9, contracts §4). Copied after packages are installed,
# so it replaces the package's default config.

[terminal]
vt = 7

# Runs once per boot, with no password: the live session's autologin.
[initial_session]
command = "labwc"
user = "jarvis"

# If that session ever ends, greetd falls back to a text login on vt 7.
[default_session]
command = "agreety --cmd labwc"
user = "_greetd"
