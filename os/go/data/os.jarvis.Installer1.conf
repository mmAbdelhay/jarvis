<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!-- Installed to /usr/share/dbus-1/system.d/os.jarvis.Installer1.conf (live
     ISO only). Only root may own the name. Anyone may call it: the backend
     checks the caller's UID (a regular user) and asks polkit for
     os.jarvis.installer.run before every method. -->
<busconfig>
  <policy user="root">
    <allow own="os.jarvis.Installer1"/>
    <allow send_destination="os.jarvis.Installer1"/>
  </policy>
  <policy context="default">
    <allow send_destination="os.jarvis.Installer1" send_interface="os.jarvis.Installer1"/>
    <allow send_destination="os.jarvis.Installer1" send_interface="org.freedesktop.DBus.Introspectable"/>
    <allow send_destination="os.jarvis.Installer1" send_interface="org.freedesktop.DBus.Peer"/>
  </policy>
</busconfig>
