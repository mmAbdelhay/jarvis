<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- Arabic text in the shell, installer, greeter, lock screen and classic
     desktop (M4 contracts §3). IBM Plex Sans Arabic when the installed
     fonts-ibm-plex has it, else Noto Sans Arabic; fontconfig skips a family
     that is not installed, so one rule covers both. Serif Arabic is Noto
     Naskh Arabic; Noto Kufi Arabic is available for headings. Latin stays
     Inter (jarvis-ui), whose missing Arabic glyphs fall back to the same
     Arabic face. -->
<fontconfig>
  <match target="pattern">
    <test name="lang" compare="contains"><string>ar</string></test>
    <test qual="any" name="family"><string>sans-serif</string></test>
    <edit name="family" mode="prepend" binding="strong">
      <string>IBM Plex Sans Arabic</string>
      <string>Noto Sans Arabic</string>
    </edit>
  </match>
  <match target="pattern">
    <test name="lang" compare="contains"><string>ar</string></test>
    <test qual="any" name="family"><string>serif</string></test>
    <edit name="family" mode="prepend" binding="strong">
      <string>Noto Naskh Arabic</string>
    </edit>
  </match>
  <alias binding="same">
    <family>Inter</family>
    <accept>
      <family>IBM Plex Sans Arabic</family>
      <family>Noto Sans Arabic</family>
    </accept>
  </alias>
</fontconfig>
