# Jarvis OS: the five .debs, the live ISO, and the QEMU smoke tests (design
# §9, §11; success criterion 12).
#
# Linux only and path-filtered (design §3.1): ci.yml's three-OS check gates the
# app; this workflow gates the OS. Every job runs a script a developer can run
# locally with the same command — see os/iso/README.md.
name: OS

on:
  pull_request:
    paths:
      - "os/**"
      - "packages/core/**"
      - "packages/platform/**"
      - "packages/wire/**"
      - "packages/desktop/src/daemon/**"
      - "packages/desktop/package.json"
      - "packages/desktop/scripts/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/os.yml"
  push:
    branches: [master]
    # master is the default branch (contracts §6 #21). Path filters are not
    # applied to tag pushes: every os-v* tag builds.
    tags: ["os-v*"]
    paths:
      - "os/**"
      - "packages/core/**"
      - "packages/platform/**"
      - "packages/wire/**"
      - "packages/desktop/src/daemon/**"
      - "packages/desktop/package.json"
      - "packages/desktop/scripts/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/os.yml"
  workflow_dispatch:

concurrency:
  group: os-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # One version for every .deb and the ISO of this run; packages depend on
  # each other with (= version).
  OS_VERSION: "0.1.0~ci${{ github.run_number }}"

jobs:
  checks:
    name: os checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends dpkg-dev shellcheck xorriso
      - run: os/packaging/tests/run.sh
      - run: os/iso/tests/run.sh
      - run: python3 -m unittest discover -s os/iso/smoke/tests -t os/iso/smoke -v
      - run: node --test os/iso/smoke/assets/
      - name: shellcheck
        run: |
          {
            git ls-files os/packaging os/iso | while read -r f; do
              head -n1 "$f" | grep -qE '^#!.*(/|env )(ba)?sh' && echo "$f"
            done
          } | xargs shellcheck -x -S warning

  build-go:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: os/go/go.mod
          cache-dependency-path: os/go/go.sum
      # dbus-daemon: Plan B's helper bus test skips without it (contracts §6 #17).
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends dpkg-dev dbus-daemon
      - run: make -C os/go check test
      - run: make -C os/go dist
      - run: os/packaging/build.sh --out out/debs jarvis-pkg jarvis-diag jarvis-helper
      - uses: actions/upload-artifact@v4
        with:
          name: debs-go
          path: out/debs/*.deb
          if-no-files-found: error
      # The MCP servers, for jarvis-shell's integration test (JARVIS_MCP_DIR).
      - uses: actions/upload-artifact@v4
        with:
          name: go-dist
          path: os/go/dist/
          if-no-files-found: error

  build-daemon:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          # Same major as the Node bundled in the .deb: node-pty's binding is
          # compiled here and must match its ABI.
          node-version: 24
          cache: pnpm
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends dpkg-dev
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm bootstrap --pty-only
      - run: pnpm --filter @jarvis/desktop build:daemon
      - uses: actions/cache@v4
        with:
          path: ~/.cache/jarvis-os
          key: node-${{ hashFiles('os/packaging/jarvisd/node.env') }}
      - run: os/packaging/build.sh --out out/debs jarvisd
      - uses: actions/upload-artifact@v4
        with:
          name: debs-daemon
          path: out/debs/*.deb
          if-no-files-found: error

  build-shell:
    needs: build-go
    runs-on: ubuntu-24.04
    # Built against the Qt that the ISO ships.
    container: debian:trixie
    steps:
      - run: apt-get update -qq && DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends git ca-certificates
      - uses: actions/checkout@v4
      # Plan C's build list (os/shell/deps/debian-build.txt) plus what the
      # packaging and node-pty's compile need.
      - name: Install build dependencies
        run: |
          grep -v '^[[:space:]]*#' os/shell/deps/debian-build.txt | awk 'NF' > /tmp/build-deps
          DEBIAN_FRONTEND=noninteractive xargs -a /tmp/build-deps \
            apt-get install -y -qq --no-install-recommends dpkg-dev xz-utils file python3 make
      - uses: pnpm/action-setup@v4
      # Node 24 ahead of Debian's nodejs on PATH (node:sqlite, see ci.yml).
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm bootstrap --pty-only
      - uses: actions/download-artifact@v4
        with:
          name: go-dist
          path: os/go/dist
      - run: chmod +x os/go/dist/usr/lib/jarvis/mcp/* os/go/dist/usr/libexec/jarvis/*
      # Plan C's entry point: configures with -DCMAKE_INSTALL_PREFIX=/usr,
      # builds, runs every test and checks the install layout (contracts §6 #18).
      - run: os/shell/ci/test.sh
        env:
          JARVIS_MCP_DIR: ${{ github.workspace }}/os/go/dist/usr/lib/jarvis/mcp
      - run: os/packaging/build.sh --out out/debs jarvis-shell
      - uses: actions/upload-artifact@v4
        with:
          name: debs-shell
          path: out/debs/*.deb
          if-no-files-found: error

  build-iso:
    needs: [build-go, build-daemon, build-shell]
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo mkdir -p /mnt/lb-work
          df -h / /mnt
      - uses: actions/download-artifact@v4
        with:
          pattern: debs-*
          merge-multiple: true
          path: ${{ runner.temp }}/iso/debs
      - id: week
        run: echo "week=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/lb-cache
          key: lb-trixie-${{ hashFiles('os/iso/config/package-lists/**', 'os/iso/auto/config') }}-${{ steps.week.outputs.week }}
          restore-keys: lb-trixie-
      - name: Build the ISO (privileged debian:trixie)
        run: |
          mkdir -p "$RUNNER_TEMP/lb-cache"
          sudo docker run --rm --privileged \
            -v "$GITHUB_WORKSPACE:/src:ro" \
            -v "$RUNNER_TEMP/iso:/out" \
            -v "$RUNNER_TEMP/lb-cache:/cache" \
            -v /mnt/lb-work:/work \
            debian:trixie /src/os/iso/build.sh --debs /out/debs --out /out/dist --work /work/iso --cache /cache
      - run: sudo chown -R "$(id -u):$(id -g)" "$RUNNER_TEMP/iso" "$RUNNER_TEMP/lb-cache"
      - name: Surface build warnings
        run: |
          w="$RUNNER_TEMP/iso/dist/warnings.txt"
          if [ -s "$w" ]; then
            while IFS= read -r line; do echo "::warning title=ISO build::$line"; done < "$w"
            { echo "### ISO build warnings"; echo; sed 's/^/- /' "$w"; } >> "$GITHUB_STEP_SUMMARY"
          fi
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends xorriso
      - run: os/iso/scripts/check-iso.sh "$RUNNER_TEMP"/iso/dist/*.iso
      - uses: actions/upload-artifact@v4
        with:
          name: jarvis-os-iso
          path: ${{ runner.temp }}/iso/dist/
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  smoke-test:
    needs: build-iso
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends qemu-system-x86 xorriso
      - name: Enable KVM
        id: kvm
        run: |
          if [ -e /dev/kvm ]; then
            echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
            sudo udevadm control --reload-rules
            sudo udevadm trigger --name-match=kvm
          fi
          if [ -w /dev/kvm ]; then accel=kvm; else accel=tcg; fi
          echo "accel=$accel" >> "$GITHUB_OUTPUT"
          echo "QEMU acceleration: **$accel**" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/download-artifact@v4
        with:
          name: jarvis-os-iso
          path: ${{ runner.temp }}/iso
      - run: |
          python3 os/iso/smoke/run_smoke.py \
            --iso "$(ls "$RUNNER_TEMP"/iso/*.iso)" \
            --out "$RUNNER_TEMP/smoke" \
            --accel "${{ steps.kvm.outputs.accel }}"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-results
          path: ${{ runner.temp }}/smoke/
          if-no-files-found: warn

  release:
    if: startsWith(github.ref, 'refs/tags/os-v')
    needs: smoke-test
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: jarvis-os-iso
          path: iso
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft \
            --title "Jarvis OS ${GITHUB_REF_NAME#os-v}" \
            --notes "Live ISO built and smoke-tested by run ${{ github.run_id }}." \
            iso/*.iso iso/*.iso.sha256
