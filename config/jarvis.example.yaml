agents:
  claude-mm:
    command: claude-mm
    model: opus
    default: true
    # The CLAUDE_CONFIG_DIR this account's wrapper sets. Its presence is what
    # lets Jarvis read this account's remaining capacity; omit it and capacity
    # is honestly shown as unknown rather than guessed.
    configDir: ~/.claude-main
    # Which public status page speaks for this provider.
    vendor: anthropic
  claude-acme:
    command: claude-acme
    model: opus
    configDir: ~/.claude-acme
    vendor: anthropic
  copilot:
    command: copilot
    args: ["-p"]
    # No configDir: GitHub Copilot has no standalone quota query, so its
    # capacity is reported as "not available", never invented.
    vendor: github

routing:
  - match: { project: acme }
    agent: claude-acme

projects:
  acme: ~/projects/acme
  storefront: ~/projects/storefront
  atlas: ~/projects/atlas
  globex: ~/projects/globex

# Which folders inside a project the Editor button can open code-server at.
# Optional, and most projects have no entry: without one the editor opens at
# the project directory, as it always did. With one root the button opens
# straight into it; with two or more it offers a menu.
#
# `path` is relative to the project directory and must stay inside it — an
# absolute (or ~) path is refused at load time. An editor root is a
# *narrowing* of a project, and the project directory is what its terminal,
# git view and API tab all key off; a root outside it would be an editor onto
# something none of them can see.
editors:
  acme:
    - { name: portal-vue, path: portal-vue }
    - { name: api, path: api }

# Where each project's people talk. `driver` is slack or teams; `account`
# says which org — the subdomain for Slack, the tenant domain or id for
# Teams — and is optional, absent meaning the provider's own picker.
#
# There is deliberately no token here. A chat tab is the provider's web app
# opened in the project's own browser partition, so you sign in once, in the
# tab, and two projects on two Teams tenants never see each other's session.
chat:
  acme:
    - { name: Acme, driver: slack, account: acme }
  globex:
    - { name: Globex, driver: teams }

brain:
  cwd: ~/.config/jarvis/brain
  # Which account Jarvis's own reasoning runs under. Setting it makes the
  # brain's spend attributable, and lets its usage reading be credited to that
  # account for free — no extra billed query. Omit it and no capacity is
  # attributed to anyone (Jarvis will not guess which account paid).
  accountId: claude-mm
  systemPrompt: |
    You are Jarvis, a voice assistant that runs coding sessions.
    The user speaks Arabic and English. Always reply in the language they used.
    Keep spoken replies to one or two sentences.

whisper:
  binaryPath: ~/.voicemode/services/whisper/build/bin/whisper-cli
  # large-v3-turbo, not base: base corrupts Arabic project names in testing
  # (e.g. "سعودي سيل" transcribed as "سعودي ينسيل"), which breaks project
  # resolution since routing depends on that exact token.
  modelPath: ~/.whisper-models/ggml-large-v3-turbo.bin
