# How Jarvis is turned into a real macOS .app.
#
# This lives beside package.json rather than inside it because every
# decision below needs a reason attached, and package.json is JSON — it
# cannot hold one. The whole point of this file is the comments.
#
# Run it with `pnpm --filter @jarvis/desktop package`, which builds first
# (tsc + copy-vendor.mjs) and then packages the result.

appId: com.jarvis.desktop
productName: Jarvis
copyright: Jarvis

directories:
  # Build output. Ignored by git — a packaged app is never committed.
  output: release
  buildResources: assets

# ---------------------------------------------------------------------------
# What goes inside the bundle
# ---------------------------------------------------------------------------
#
# The renderer is not a single tree. `dist/renderer/app.js` is compiled
# output, but `renderer/index.html` is *not* compiled — main.ts loads it
# straight from the source directory:
#
#     window.loadFile(new URL("../../renderer/index.html", import.meta.url))
#
# From `dist/src/main.js` that resolves to `renderer/index.html`, so the
# source `renderer/` directory is a runtime asset, not a build input. And
# because index.html sits there, its own relative links resolve there too:
# `vendor/xterm.css` and `./styles.css` are read from `renderer/`, while
# the script it loads (`../dist/renderer/app.js`) imports
# `./vendor/xterm.mjs` from `dist/renderer/`. That is why copy-vendor.mjs
# duplicates the vendor directory into both trees — and why both copies
# have to be in here. A missing vendor file is not a crash; it is a blank
# terminal, which is far harder to notice.
#
# The .ts sources under renderer/ are deliberately excluded: they are build
# inputs, they include the test files, and nothing at runtime reads them.
files:
  - "dist/**/*"
  - "renderer/index.html"
  - "renderer/styles.css"
  - "renderer/vendor/**/*"
  - "package.json"
  # Test output and TypeScript declarations are dead weight in a shipped
  # app — every renderer/*.test.js and every .d.ts in the tree.
  - "!dist/**/*.test.js"
  - "!dist/**/*.test.js.map"
  - "!dist/**/*.test.d.ts"
  - "!dist/**/*.d.ts"
  - "!**/*.tsbuildinfo"
  # The same for the two workspace packages, which arrive through
  # node_modules (as pnpm symlinks that electron-builder follows and
  # materialises into the archive) and so escape the globs above.
  - "!**/node_modules/@jarvis/*/dist/**/*.test.js"
  - "!**/node_modules/@jarvis/*/dist/**/*.d.ts"
  # @anthropic-ai/claude-agent-sdk declares one optional package per
  # platform, each carrying a ~200 MB bundled runtime, and pnpm installs
  # every one of them. Only the host's own is ever loaded; the other seven
  # are a gigabyte of dead weight in the bundle. This build is macOS
  # arm64-only, so keep exactly that one.
  - "!**/node_modules/@anthropic-ai/claude-agent-sdk-{linux,win32}-*/**"
  - "!**/node_modules/@anthropic-ai/claude-agent-sdk-darwin-x64/**"

# ---------------------------------------------------------------------------
# node-pty must live outside the asar archive
# ---------------------------------------------------------------------------
#
# node-pty is the load-bearing native module: every agent session and every
# Terminal tab is a pty. Two things inside it cannot survive being sealed
# in an asar archive:
#
#   1. `prebuilds/darwin-arm64/pty.node` — a native binding. dlopen() needs
#      a real path on disk; it cannot read out of a virtual archive.
#   2. `prebuilds/darwin-arm64/spawn-helper` — an executable that the
#      darwin build *execs* to hand the child its controlling terminal.
#      Same problem, plus it needs its execute bit (see
#      ensureSpawnHelperExecutable() in packages/platform/src/pty.ts).
#
# Unpacking the whole node-pty directory keeps node-pty's own loader happy:
# lib/utils.js walks `build/Release`, `build/Debug`, then
# `prebuilds/<platform>-<arch>`, relative to both `..` and `.`, and those
# lookups all have to land on the same side of the archive boundary. It also
# keeps unixTerminal.js's `helperPath.replace('app.asar', 'app.asar.unpacked')`
# pointing at a helper that is really there.
#
# The binding itself needs no electron-rebuild: node-pty 1.1.0 is built on
# node-addon-api, so its prebuilt binary is Node-API and ABI-stable across
# both Node and Electron. Rebuilding it would be a no-op at best.
asarUnpack:
  - "**/node_modules/node-pty/**"

# ...and because that is true, the rebuild is turned off rather than merely
# described as unnecessary.
#
# Leaving it on is not harmless. @electron/rebuild does not build into a
# scratch directory — it writes `build/Release/{pty.node,spawn-helper}` into
# the pnpm store's own copy of node-pty, and lib/utils.js searches
# `build/Release` *before* `prebuilds/<platform>-<arch>`. So the first
# packaging run on a machine silently changes which binary every later run
# ships, and a clean clone (which has no `build/`) produces a different
# bundle from a machine that has packaged before. That is a reproducibility
# hole that only opens months later, on somebody else's laptop.
#
# With this false, the shipped binary is always the checked-in prebuild —
# the same bytes on every machine, and the same bytes a plain `pnpm start`
# runs during development.
npmRebuild: false

# ---------------------------------------------------------------------------
# mac
# ---------------------------------------------------------------------------
#
# `dir` and `dmg`. `dir` is what the local install script copies from and
# what the packaging run leaves behind to inspect; `dmg` is the thing
# somebody who is not you can download and open — a window with the app and
# a link to /Applications, which is the install instruction every Mac user
# already knows. Building both costs one extra step and keeps the local
# workflow exactly as it was.
#
# identity: null skips code signing during the build. There is no Developer
# ID here, and electron-builder's own ad-hoc handling is inconsistent
# across versions; signing is done afterwards, deliberately and visibly,
# with `codesign --force --deep --sign -` on the installed app.
mac:
  target:
    - target: dir
      arch:
        - arm64
    - target: dmg
      arch:
        - arm64
  # Apple Silicon only, and stated rather than implied: electronDist below
  # points at one downloaded castLabs build, and that build is arm64. An
  # Intel Mac cannot run what this produces, which the README says too.
  category: public.app-category.developer-tools
  icon: assets/icon.icns
  identity: null
  # Jarvis spawns agents and shells that read the user's files, and its
  # renderer talks to local services. The hardened runtime would need
  # entitlements and a real signing identity to allow that; with an ad-hoc
  # signature it only buys refusals.
  hardenedRuntime: false

# The disk image window: the app on the left, /Applications on the right,
# which is the drag every Mac user has already done a hundred times. Nothing
# custom beyond that — a background image would be one more asset to keep in
# step with the icon for no instruction the layout does not already give.
dmg:
  title: Jarvis ${version}
  contents:
    - x: 140
      y: 200
      type: file
    - x: 400
      y: 200
      type: link
      path: /Applications

# ---------------------------------------------------------------------------
# Which Electron gets packaged
# ---------------------------------------------------------------------------
#
# Electron for Content Security is not published on electron/electron's
# releases, so electron-builder's usual "download the version in
# package.json" step 404s on `v44.1.0+wvcus`. Both of these are needed:
# electronDist points it at the binary that `node_modules/electron/install.js`
# already fetched from castLabs, and electronVersion gives it the plain
# semver it expects to parse, since the `+wvcus` build metadata is not
# something it can resolve to a download.
#
# The consequence worth knowing: the packaged app is whatever is currently in
# node_modules/electron/dist. A `pnpm install` that re-fetched stock Electron
# there would silently produce a build with no CDM — which the VMP signing
# hook below would then fail on, deliberately.
electronDist: node_modules/electron/dist
electronVersion: 44.1.0

# Widevine signing. See scripts/vmp-sign.cjs for why this runs here and not
# in afterSign: on macOS the VMP signature must be inside the bundle before
# the code signature covers it. Without this the packaged app plays no DRM —
# Netflix answers a development-signed client with E100.
afterPack: scripts/vmp-sign.cjs

# Nothing here is published anywhere.
publish: null
