<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <title>Jarvis</title>
  <!--
    Jarvis' app icon.

    The colours are the app's own (ground #060a0f, accent #45c8dc), so the
    dock tile and the window agree rather than looking like two products.

    The J is drawn as geometry rather than set in a typeface, because the
    icon has to hold at 32px in the dock, where a font's thin strokes and
    tapered terminals disappear into the background. Solid fills rather than
    gradients for the same reason, and because a gradient is the first thing
    a rasteriser gets wrong.
  -->
  <rect x="0" y="0" width="1024" height="1024" rx="228" fill="#060a0f"/>
  <rect x="10" y="10" width="1004" height="1004" rx="220" fill="none"
        stroke="#1c3f49" stroke-width="18"/>

  <!-- The stem and hook of the J, square-cut to match the app's
       monospaced, terminal-first look. -->
  <path d="M628 268 h96 v368 a192 192 0 0 1 -192 192 h-64 a192 192 0 0 1 -192 -192 v-56 h96 v56
           a96 96 0 0 0 96 96 h64 a96 96 0 0 0 96 -96 z"
        fill="#45c8dc"/>
  <!-- The bar across the top: what makes it read as a J at 32px rather than
       as a mirrored L. -->
  <rect x="456" y="268" width="268" height="92" rx="8" fill="#45c8dc"/>
</svg>
